name: Captain
options:
  bundleIdPrefix: com.jackdickman
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: NO  # not needed for simulator

targets:
  Captain:
    type: application
    platform: iOS
    bundleId: com.jackdickman.Captain
    sources:
      - path: Captain
    settings:
      base:
        PRODUCT_NAME: Captain
        TARGETED_DEVICE_FAMILY: "1"  # iPhone only
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: Captain
        INFOPLIST_KEY_NSCameraUsageDescription: "Captain uses your camera so you can snap photos of your home to share in chat."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Captain reads photos from your library so you can attach them to chat messages about your home."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_ASSET_PATHS: "\"Captain/Preview Content\""
        ENABLE_PREVIEWS: YES
